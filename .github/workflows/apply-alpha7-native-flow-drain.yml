name: Apply alpha.7 native flow drain

on:
  push:
    branches:
      - feature/v0.3.0-alpha7

permissions:
  contents: write

concurrency:
  group: apply-alpha7-native-flow-drain
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3.0-alpha7
          fetch-depth: 2
      - name: Apply and remove patch files
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix_alpha7_native_flow_drain.py
          gofmt -w engine/go/bridge/session.go engine/go/bridge/flow_tracker.go engine/go/bridge/flow_tracker_test.go
          git rm -f \
            scripts/fix_alpha7_native_flow_drain.py \
            .github/workflows/apply-alpha7-native-flow-drain.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: drain native remote flows before Stop returns"
          git push origin HEAD:feature/v0.3.0-alpha7
