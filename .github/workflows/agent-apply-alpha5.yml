name: Apply reviewed ConnectX alpha.5 change set

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/v0.3.0-alpha5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout alpha.5 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Apply reviewed alpha.5 patch
        shell: bash
        run: |
          set -euo pipefail
          stage_dir='.github/alpha5-stage'
          test -f "$stage_dir/part-00"
          test -f "$stage_dir/part-01"
          test -f "$stage_dir/part-02"

          cat "$stage_dir"/part-* > /tmp/alpha5.patch.gz.b64
          echo '10c12853b2c33fd0e15a89a9c1a760ca248a21c882527694a16145fbfc347e0c  /tmp/alpha5.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/alpha5.patch.gz.b64 > /tmp/alpha5.patch.gz
          echo 'cc116e43744b4f6b7d03a0fc3bba84b2516d1f34f4e6de569ba900b1ce1968ee  /tmp/alpha5.patch.gz' | sha256sum -c -
          gzip -dc /tmp/alpha5.patch.gz > /tmp/alpha5.patch
          echo 'e980f3133f82c5affadcc3e2763e0757554115c0045d9b7a312100034b6eade4  /tmp/alpha5.patch' | sha256sum -c -

          git apply --check /tmp/alpha5.patch
          git apply /tmp/alpha5.patch
          rm -rf "$stage_dir" .github/workflows/agent-apply-alpha5.yml

          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep -E '^\.github/alpha5-stage/|^\.github/workflows/agent-apply-alpha5\.yml$' || true)"
          test -n "$(git diff --cached --name-only)"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: prepare ConnectX v0.3.0-alpha.5'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
