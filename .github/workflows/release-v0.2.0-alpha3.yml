name: Publish v0.2.0-alpha.3

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'feature/v0.2.0-alpha3')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}

    steps:
      - name: Resolve release commit
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.pull_request.merge_commit_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go 1.26.3
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache-dependency-path: |
            engine/go/go.mod
            engine/go/go.sum

      - name: Install locked Android NDK
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108"

      - name: Verify and build locked native bridge
        shell: bash
        run: |
          cd engine/go
          go mod download
          go mod verify
          go test -mod=readonly ./bridge
          git diff --exit-code -- go.mod go.sum
          cd ../..
          chmod +x engine/go/build-android.sh
          engine/go/build-android.sh "$ANDROID_SDK_ROOT/ndk/28.0.13004108"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run JVM tests and lint
        run: |
          gradle test --no-daemon
          gradle lintDebug --no-daemon

      - name: Build and verify APK
        shell: bash
        run: |
          gradle :app:assembleDebug --no-daemon
          unzip -l app/build/outputs/apk/debug/app-debug.apk | tee apk-contents.txt
          grep -q 'lib/arm64-v8a/libconnectxbridge.so' apk-contents.txt
          grep -q 'lib/x86_64/libconnectxbridge.so' apk-contents.txt
          grep -q 'assets/THIRD_PARTY_NOTICES.md' apk-contents.txt
          grep -q 'assets/tun2socks-MIT.txt' apk-contents.txt
          grep -q 'assets/gvisor-LICENSE.txt' apk-contents.txt

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk \
            release-assets/ConnectX-v0.2.0-alpha.3-debug.apk
          (cd engine/go/build/android && \
            zip -r "$GITHUB_WORKSPACE/release-assets/ConnectX-v0.2.0-alpha.3-native.zip" .)
          cp THIRD_PARTY_NOTICES.md \
            release-assets/THIRD_PARTY_NOTICES-v0.2.0-alpha.3.md
          cp licenses/tun2socks-MIT.txt release-assets/tun2socks-MIT.txt
          cp licenses/gvisor-LICENSE.txt release-assets/gvisor-LICENSE.txt
          (cd release-assets && sha256sum * > CHECKSUMS.txt)

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: alpha3-release-assets-${{ steps.target.outputs.sha }}
          path: release-assets
          if-no-files-found: error
          retention-days: 14

      - name: Upload native runtime payload
        uses: actions/upload-artifact@v4
        with:
          name: alpha3-native-${{ steps.target.outputs.sha }}
          path: engine/go/build/android
          if-no-files-found: error
          retention-days: 14

  android-runtime-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_AVD_HOME: ${{ runner.temp }}/connectx-release-avd
      ANDROID_USER_HOME: ${{ runner.temp }}/connectx-release-android-user

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.target_sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Download verified native runtime payload
        uses: actions/download-artifact@v4
        with:
          name: alpha3-native-${{ needs.verify.outputs.target_sha }}
          path: engine/go/build/android

      - name: Verify KVM acceleration
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Install Android emulator image
        shell: bash
        run: |
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/emulator/emulator"
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check | tee accel-check.txt
          echo no | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" \
            create avd \
            --force \
            --name connectx-release-ci \
            --path "$ANDROID_AVD_HOME/connectx-release-ci.avd" \
            --package "system-images;android-35;google_apis;x86_64"

          AVD_CONFIG="$ANDROID_AVD_HOME/connectx-release-ci.avd/config.ini"
          test -f "$AVD_CONFIG"
          sed -i '/^disk.dataPartition.size=/d' "$AVD_CONFIG"
          sed -i '/^hw.ramSize=/d' "$AVD_CONFIG"
          printf '\ndisk.dataPartition.size=2048M\nhw.ramSize=2048\n' >> "$AVD_CONFIG"
          grep -E '^(disk.dataPartition.size|hw.ramSize)=' "$AVD_CONFIG" | tee avd-storage.txt

          "$ANDROID_SDK_ROOT/emulator/emulator" -list-avds | tee avd-list.txt
          grep -qx 'connectx-release-ci' avd-list.txt

      - name: Start emulator and wait for Android
        shell: bash
        run: |
          ADB="$ANDROID_SDK_ROOT/platform-tools/adb"
          EMULATOR="$ANDROID_SDK_ROOT/emulator/emulator"

          nohup "$EMULATOR" \
            -avd connectx-release-ci \
            -accel on \
            -memory 2048 \
            -partition-size 2048 \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -no-snapshot-save \
            -no-metrics \
            -gpu swiftshader_indirect \
            > emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > emulator.pid

          sleep 5
          if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
            cat accel-check.txt 2>/dev/null || true
            cat avd-list.txt 2>/dev/null || true
            cat avd-storage.txt 2>/dev/null || true
            cat emulator.log
            exit 1
          fi

          "$ADB" start-server
          timeout 300 "$ADB" wait-for-device

          DEADLINE=$((SECONDS + 300))
          while true; do
            BOOT_COMPLETED="$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [[ "$BOOT_COMPLETED" == "1" ]]; then
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Android emulator exited before boot completed" >&2
              cat accel-check.txt 2>/dev/null || true
              cat avd-list.txt 2>/dev/null || true
              cat avd-storage.txt 2>/dev/null || true
              cat emulator.log
              exit 1
            fi
            if (( SECONDS >= DEADLINE )); then
              echo "Timed out waiting for Android boot" >&2
              cat accel-check.txt 2>/dev/null || true
              cat avd-list.txt 2>/dev/null || true
              cat avd-storage.txt 2>/dev/null || true
              cat emulator.log
              exit 1
            fi
            sleep 5
          done

          "$ADB" shell getprop ro.product.cpu.abi
          "$ADB" shell getprop ro.build.version.sdk

      - name: Run native bridge Android smoke test
        run: gradle --no-daemon :vpn:nativebridge:connectedDebugAndroidTest

      - name: Upload emulator diagnostics
        if: always()
        shell: bash
        run: |
          ADB="$ANDROID_SDK_ROOT/platform-tools/adb"
          mkdir -p emulator-diagnostics
          cp emulator.log emulator-diagnostics/ 2>/dev/null || true
          cp emulator.pid emulator-diagnostics/ 2>/dev/null || true
          cp accel-check.txt emulator-diagnostics/ 2>/dev/null || true
          cp avd-list.txt emulator-diagnostics/ 2>/dev/null || true
          cp avd-storage.txt emulator-diagnostics/ 2>/dev/null || true
          timeout 10 "$ADB" devices -l > emulator-diagnostics/devices.txt 2>&1 || true
          timeout 10 "$ADB" logcat -d > emulator-diagnostics/logcat.txt 2>&1 || true
          cp -R vpn/nativebridge/build/reports/androidTests \
            emulator-diagnostics/reports 2>/dev/null || true
          cp -R vpn/nativebridge/build/outputs/androidTest-results \
            emulator-diagnostics/results 2>/dev/null || true

      - name: Store emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha3-emulator-smoke-${{ needs.verify.outputs.target_sha }}
          path: emulator-diagnostics
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [verify, android-runtime-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.target_sha }}

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: alpha3-release-assets-${{ needs.verify.outputs.target_sha }}
          path: release-assets

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v0.2.0-alpha.3
          TARGET_SHA: ${{ needs.verify.outputs.target_sha }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG_NAME" \
            release-assets/* \
            --target "$TARGET_SHA" \
            --title "ConnectX v0.2.0-alpha.3 — Controlled Native Self-Test" \
            --notes-file docs/releases/v0.2.0-alpha.3.md \
            --prerelease
