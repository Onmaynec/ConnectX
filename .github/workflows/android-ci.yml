name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify guarded release manifest and negative tests
        shell: bash
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_release_guard.py'
          python3 scripts/release_guard.py validate-repo

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.26.3
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: |
            engine/go/go.mod
            engine/go/go.sum

      - name: Install locked Android NDK
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108"

      - name: Test committed Go dependency lock
        working-directory: engine/go
        shell: bash
        run: |
          go mod download
          go mod verify
          go test -mod=readonly ./bridge
          git diff --exit-code -- go.mod go.sum

      - name: Build Android native bridge
        shell: bash
        run: |
          chmod +x engine/go/build-android.sh
          engine/go/build-android.sh "$ANDROID_SDK_ROOT/ndk/28.0.13004108"
          test -s engine/go/build/android/jniLibs/arm64-v8a/libconnectxbridge.so
          test -s engine/go/build/android/jniLibs/x86_64/libconnectxbridge.so
          file engine/go/build/android/jniLibs/*/libconnectxbridge.so

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests
        run: gradle --no-daemon test

      - name: Android lint
        run: gradle --no-daemon lintDebug

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify native and legal APK payloads
        shell: bash
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | tee apk-contents.txt
          grep -q 'lib/arm64-v8a/libconnectxbridge.so' apk-contents.txt
          grep -q 'lib/x86_64/libconnectxbridge.so' apk-contents.txt
          grep -q 'assets/THIRD_PARTY_NOTICES.md' apk-contents.txt
          grep -q 'assets/tun2socks-MIT.txt' apk-contents.txt
          grep -q 'assets/gvisor-LICENSE.txt' apk-contents.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: connectx-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload native bridge
        uses: actions/upload-artifact@v4
        with:
          name: connectx-native-${{ github.sha }}
          path: engine/go/build/android
          if-no-files-found: error
          retention-days: 14

  android-runtime-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Android runtime paths
        shell: bash
        run: |
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/connectx-avd" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/connectx-android-user" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Download verified native bridge
        uses: actions/download-artifact@v4
        with:
          name: connectx-native-${{ github.sha }}
          path: engine/go/build/android

      - name: Free runtime runner disk
        shell: bash
        run: |
          sudo rm -rf "$ANDROID_SDK_ROOT/ndk" "$ANDROID_SDK_ROOT/cmake"
          sudo rm -rf "$ANDROID_SDK_ROOT/system-images"
          sudo rm -rf /opt/hostedtoolcache/go
          sudo apt-get clean
          df -h / | tee disk-after-cleanup.txt

      - name: Verify KVM acceleration
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Install Android emulator image
        shell: bash
        run: |
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/emulator/emulator"
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check | tee accel-check.txt
          echo no | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" \
            create avd \
            --force \
            --name connectx-ci \
            --path "$ANDROID_AVD_HOME/connectx-ci.avd" \
            --package "system-images;android-35;google_apis;x86_64"
          "$ANDROID_SDK_ROOT/emulator/emulator" -list-avds | tee avd-list.txt
          grep -qx 'connectx-ci' avd-list.txt
          df -h / | tee disk-before-emulator.txt

      - name: Start emulator and wait for Android
        shell: bash
        run: |
          ADB="$ANDROID_SDK_ROOT/platform-tools/adb"
          EMULATOR="$ANDROID_SDK_ROOT/emulator/emulator"
          nohup "$EMULATOR" \
            -avd connectx-ci \
            -accel on \
            -memory 2048 \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -no-snapshot-save \
            -no-metrics \
            -gpu swiftshader_indirect \
            > emulator.log 2>&1 &
          echo "$!" > emulator.pid

          sleep 5
          if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then
            cat disk-before-emulator.txt 2>/dev/null || true
            cat accel-check.txt 2>/dev/null || true
            cat avd-list.txt 2>/dev/null || true
            cat emulator.log
            exit 1
          fi

          "$ADB" start-server
          timeout 300 "$ADB" wait-for-device
          DEADLINE=$((SECONDS + 300))
          until [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; do
            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then
              cat disk-before-emulator.txt 2>/dev/null || true
              cat emulator.log
              exit 1
            fi
            if (( SECONDS >= DEADLINE )); then
              cat disk-before-emulator.txt 2>/dev/null || true
              cat emulator.log
              exit 1
            fi
            sleep 5
          done
          "$ADB" shell getprop ro.product.cpu.abi
          "$ADB" shell getprop ro.build.version.sdk

      - name: Run isolated strategy, evidence, JNI, TCP, UDP and DNS gates
        shell: bash
        run: |
          set -euo pipefail
          ADB="$ANDROID_SDK_ROOT/platform-tools/adb"
          RESULTS="$GITHUB_WORKSPACE/runtime-test-results"
          mkdir -p "$RESULTS"

          archive_results() {
            local name="$1"
            mkdir -p "$RESULTS/$name"
            cp -R app/build/reports/androidTests \
              "$RESULTS/$name/reports" 2>/dev/null || true
            cp -R app/build/outputs/androidTest-results \
              "$RESULTS/$name/results" 2>/dev/null || true
          }

          reset_vpn_process() {
            "$ADB" shell am force-stop dev.connectx || true
            "$ADB" shell am force-stop dev.connectx.test || true
            "$ADB" shell appops set dev.connectx ACTIVATE_VPN default || true

            local deadline=$((SECONDS + 10))
            while (( SECONDS < deadline )); do
              if [[ -z "$("$ADB" shell pidof dev.connectx 2>/dev/null | tr -d '\r')" ]]; then
                break
              fi
              sleep 1
            done
            sleep 3
          }

          run_app_gate() {
            local name="$1"
            local class_name="$2"
            set +e
            gradle --no-daemon \
              :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class="$class_name"
            local status=$?
            set -e
            archive_results "$name"
            reset_vpn_process
            if (( status != 0 )); then
              exit "$status"
            fi
          }

          run_app_gate \
            strategy-foundation \
            dev.connectx.app.StrategyFoundationInstrumentedTest
          run_app_gate \
            strategy-tun \
            dev.connectx.app.NativeTlsSplitProbeInstrumentedTest
          run_app_gate \
            strategy-evaluation \
            dev.connectx.app.StrategyEvaluationInstrumentedTest
          run_app_gate \
            external-tls-evidence \
            dev.connectx.app.ExternalTlsEvidenceInstrumentedTest

          gradle --no-daemon :vpn:nativebridge:connectedDebugAndroidTest
          reset_vpn_process

          run_app_gate \
            tcp \
            dev.connectx.app.NativeTcpProbeInstrumentedTest
          run_app_gate \
            udp \
            dev.connectx.app.NativeUdpProbeInstrumentedTest
          run_app_gate \
            dns \
            dev.connectx.app.NativeDnsProbeInstrumentedTest

      - name: Collect emulator diagnostics
        if: always()
        shell: bash
        run: |
          ADB="$ANDROID_SDK_ROOT/platform-tools/adb"
          mkdir -p emulator-diagnostics
          cp emulator.log emulator-diagnostics/ 2>/dev/null || true
          cp emulator.pid emulator-diagnostics/ 2>/dev/null || true
          cp accel-check.txt emulator-diagnostics/ 2>/dev/null || true
          cp avd-list.txt emulator-diagnostics/ 2>/dev/null || true
          cp disk-after-cleanup.txt emulator-diagnostics/ 2>/dev/null || true
          cp disk-before-emulator.txt emulator-diagnostics/ 2>/dev/null || true
          timeout 10 "$ADB" devices -l > emulator-diagnostics/devices.txt 2>&1 || true
          timeout 10 "$ADB" logcat -d > emulator-diagnostics/logcat.txt 2>&1 || true
          cp -R vpn/nativebridge/build/reports/androidTests \
            emulator-diagnostics/nativebridge-reports 2>/dev/null || true
          cp -R vpn/nativebridge/build/outputs/androidTest-results \
            emulator-diagnostics/nativebridge-results 2>/dev/null || true
          cp -R runtime-test-results \
            emulator-diagnostics/app-isolated-results 2>/dev/null || true
          cp -R app/build/reports/androidTests \
            emulator-diagnostics/app-last-reports 2>/dev/null || true
          cp -R app/build/outputs/androidTest-results \
            emulator-diagnostics/app-last-results 2>/dev/null || true

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectx-emulator-smoke-${{ github.sha }}
          path: emulator-diagnostics
          if-no-files-found: warn
          retention-days: 14
