name: Apply alpha.7 physical evidence kit

on:
  push:
    branches:
      - feature/v0.3.0-alpha7

permissions:
  contents: write

concurrency:
  group: apply-alpha7-physical-evidence
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.3.0-alpha7
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Apply deterministic alpha.7 change set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          OLD = "0.3.0-alpha.6"
          NEW = "0.3.0-alpha.7"
          MARKER = Path("strategy/api/src/main/kotlin/dev/connectx/strategy/api/PhysicalDeviceEvidence.kt")

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence of {old!r}, found {count}")
              write(path, text.replace(old, new, 1))

          def replace_all(path, old, new):
              text = read(path)
              if old not in text:
                  return False
              write(path, text.replace(old, new))
              return True

          if MARKER.exists():
              print("alpha.7 change set already applied")
              raise SystemExit(0)

          for directory in ("app", "strategy", "vpn", "engine/go/bridge"):
              for path in Path(directory).rglob("*"):
                  if path.is_file() and path.suffix in {".kt", ".kts", ".go"}:
                      replace_all(path, OLD, NEW)
                      replace_all(path, "v0.3 alpha.6", "v0.3 alpha.7")

          replace_once("app/build.gradle.kts", "versionCode = 13", "versionCode = 14")

          guard_test = "scripts/tests/test_release_guard.py"
          replace_all(guard_test, OLD, NEW)
          replace_all(guard_test, '"version_code": 13', '"version_code": 14')
          replace_all(guard_test, "versionCode = 13", "versionCode = 14")
          replace_all(guard_test, "alpha6-scope.md", "alpha7-scope.md")

          manifest = json.loads(read("release/prerelease.json"))
          manifest.update(
              version_name=NEW,
              version_code=14,
              tag=f"v{NEW}",
              title=f"ConnectX v{NEW} — Physical Device Evidence Kit",
              notes_path=f"docs/releases/v{NEW}.md",
              scope_path="docs/roadmap/alpha7-scope.md",
          )
          write("release/prerelease.json", json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")

          verify = read("scripts/verify-alpha6-local.sh").replace("alpha6", "alpha7").replace(OLD, NEW)
          write("scripts/verify-alpha7-local.sh", verify)

          write(
              "strategy/api/src/main/kotlin/dev/connectx/strategy/api/PhysicalDeviceEvidence.kt",
              '''package dev.connectx.strategy.api

enum class ExternalTlsEvidenceDeviceClass {
    PHYSICAL,
    EMULATOR,
    UNKNOWN,
}

enum class ExternalTlsEvidenceAbiFamily {
    ARM64,
    X86_64,
    OTHER,
    UNKNOWN,
}

enum class ExternalTlsEvidenceFdStatus {
    WITHIN_BUDGET,
    EXCEEDED,
    UNKNOWN,
}

data class ExternalTlsEvidenceEnvironment(
    val deviceClass: ExternalTlsEvidenceDeviceClass,
    val androidApi: Int?,
    val abiFamily: ExternalTlsEvidenceAbiFamily,
)

data class ExternalTlsEvidenceFdSample(
    val before: Int?,
    val after: Int?,
    val allowedDelta: Int = DEFAULT_ALLOWED_FD_DELTA,
)

data class ExternalTlsEvidenceFdAssessment(
    val status: ExternalTlsEvidenceFdStatus,
    val delta: Int?,
    val allowedDelta: Int,
)

object ExternalTlsEvidenceEnvironmentPolicy {
    fun classifyAbi(rawAbi: String?): ExternalTlsEvidenceAbiFamily = when {
        rawAbi.isNullOrBlank() -> ExternalTlsEvidenceAbiFamily.UNKNOWN
        rawAbi.equals("arm64-v8a", ignoreCase = true) ||
            rawAbi.contains("aarch64", ignoreCase = true) ->
            ExternalTlsEvidenceAbiFamily.ARM64
        rawAbi.equals("x86_64", ignoreCase = true) ||
            rawAbi.contains("amd64", ignoreCase = true) ->
            ExternalTlsEvidenceAbiFamily.X86_64
        else -> ExternalTlsEvidenceAbiFamily.OTHER
    }

    fun assessFd(sample: ExternalTlsEvidenceFdSample): ExternalTlsEvidenceFdAssessment {
        val before = sample.before
        val after = sample.after
        val allowed = sample.allowedDelta
        if (before == null || after == null || before < 0 || after < 0 || allowed < 0) {
            return ExternalTlsEvidenceFdAssessment(
                status = ExternalTlsEvidenceFdStatus.UNKNOWN,
                delta = null,
                allowedDelta = allowed.coerceAtLeast(0),
            )
        }
        val delta = after - before
        return ExternalTlsEvidenceFdAssessment(
            status = if (delta <= allowed) {
                ExternalTlsEvidenceFdStatus.WITHIN_BUDGET
            } else {
                ExternalTlsEvidenceFdStatus.EXCEEDED
            },
            delta = delta,
            allowedDelta = allowed,
        )
    }
}

const val DEFAULT_ALLOWED_FD_DELTA: Int = 4
''',
          )

          write(
