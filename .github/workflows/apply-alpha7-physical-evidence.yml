name: Apply alpha.7 physical evidence kit

on:
  push:
    branches:
      - feature/v0.3.0-alpha7

permissions:
  contents: write

concurrency:
  group: apply-alpha7-physical-evidence
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.3.0-alpha7
          fetch-depth: 2

      - name: Apply prepared change set
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/apply_alpha7.py ]]; then
            echo "alpha.7 patch script is not present yet"
            exit 0
          fi
          python3 scripts/apply_alpha7.py
          chmod +x \
            scripts/verify-alpha7-local.sh \
            scripts/collect-alpha7-physical-evidence.sh \
            scripts/validate_device_evidence_bundle.py
          git rm \
            .github/workflows/apply-alpha7-physical-evidence.yml \
            scripts/apply_alpha7.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: ConnectX v0.3.0-alpha.7 physical device evidence kit"
          git push origin HEAD:feature/v0.3.0-alpha7
