name: Publish v0.3.0-alpha.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.3.0-alpha3.yml
      - docs/releases/v0.3.0-alpha.3.publish
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: release-v0.3.0-alpha.3
  cancel-in-progress: false

jobs:
  publish-verified-artifacts:
    name: Publish verified alpha.3 artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_SHA: ${{ github.sha }}
      TAG_NAME: v0.3.0-alpha.3
      SOURCE_RUN_ID: "31037664649"
      SOURCE_HEAD_SHA: 26a9eef859c08fee15070587855e53ebc8b5627a
      SOURCE_ARTIFACT_SHA: 838a152eece9ee3c35cd5a29d672b8d52d5c252d
      SOURCE_BRANCH: fix/alpha3-single-workflow-release
      MARKER_PATH: docs/releases/v0.3.0-alpha.3.publish

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify release metadata and trusted CI source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            parent_sha="$(git rev-parse "$TARGET_SHA^1")"
            git diff --name-only "$parent_sha" "$TARGET_SHA" | sort > release-changed-files.txt
            grep -Fxq '.github/workflows/release-v0.3.0-alpha3.yml' release-changed-files.txt
            grep -Fxq "$MARKER_PATH" release-changed-files.txt
          fi

          grep -Fq 'Publish ConnectX v0.3.0-alpha.3' "$MARKER_PATH"
          grep -Fq 'versionCode = 10' app/build.gradle.kts
          grep -Fq 'versionName = "0.3.0-alpha.3"' app/build.gradle.kts
          grep -Fq '## [0.3.0-alpha.3]' CHANGELOG.md
          test -s docs/releases/v0.3.0-alpha.3.md
          test -s THIRD_PARTY_NOTICES.md
          test -s licenses/tun2socks-MIT.txt
          test -s licenses/gvisor-LICENSE.txt

          run_json="$(gh run view "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json name,status,conclusion,event,headSha,headBranch)"
          test "$(jq -r '.name' <<<"$run_json")" = 'Android CI'
          test "$(jq -r '.status' <<<"$run_json")" = 'completed'
          test "$(jq -r '.conclusion' <<<"$run_json")" = 'success'
          test "$(jq -r '.event' <<<"$run_json")" = 'pull_request'
          test "$(jq -r '.headSha' <<<"$run_json")" = "$SOURCE_HEAD_SHA"
          test "$(jq -r '.headBranch' <<<"$run_json")" = "$SOURCE_BRANCH"

          compare_json="$(gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_HEAD_SHA...$TARGET_SHA")"
          jq -e '
            ([.files[].filename] | sort) == [
              ".github/workflows/release-v0.3.0-alpha3.yml",
              "docs/releases/v0.3.0-alpha.3.publish"
            ]
          ' <<<"$compare_json" >/dev/null

      - name: Download exact successful Android CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded/apk downloaded/native
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "connectx-debug-$SOURCE_ARTIFACT_SHA" \
            --dir downloaded/apk
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "connectx-native-$SOURCE_ARTIFACT_SHA" \
            --dir downloaded/native

          echo 'e98cbab99d61c43a61d9e32ed165dd37d6fa0e17f6ac41b23cbb20908ff438e7  downloaded/apk/app-debug.apk' | sha256sum -c -
          echo '0c4bde9e937646b644380e99551a19fff17b2dd845585034116145f07ab8453d  downloaded/native/jniLibs/arm64-v8a/libconnectxbridge.so' | sha256sum -c -
          echo '439617ff179c64b1f77887f3062d77358848e390cf4f4e2eebe821801ebe4779  downloaded/native/jniLibs/x86_64/libconnectxbridge.so' | sha256sum -c -

          grep -Fq 'go_version=go1.26.3' downloaded/native/metadata/build.txt
          grep -Fq 'ndk_version=28.0.13004108' downloaded/native/metadata/build.txt
          grep -Fq 'abis=arm64-v8a,x86_64' downloaded/native/metadata/build.txt

          unzip -l downloaded/apk/app-debug.apk | tee apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libconnectxbridge.so' apk-contents.txt
          grep -Fq 'lib/x86_64/libconnectxbridge.so' apk-contents.txt
          grep -Fq 'assets/THIRD_PARTY_NOTICES.md' apk-contents.txt
          grep -Fq 'assets/tun2socks-MIT.txt' apk-contents.txt
          grep -Fq 'assets/gvisor-LICENSE.txt' apk-contents.txt

      - name: Prepare deterministic release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets native-package
          cp downloaded/apk/app-debug.apk \
            release-assets/ConnectX-v0.3.0-alpha.3-debug.apk
          cp -R downloaded/native/. native-package/

          find native-package -type f -exec touch -t 198001010000 {} +
          (cd native-package && \
            find . -type f -print0 | sort -z | \
            xargs -0 zip -X "$GITHUB_WORKSPACE/release-assets/ConnectX-v0.3.0-alpha.3-native.zip")

          cp THIRD_PARTY_NOTICES.md \
            release-assets/THIRD_PARTY_NOTICES-v0.3.0-alpha.3.md
          cp licenses/tun2socks-MIT.txt release-assets/tun2socks-MIT.txt
          cp licenses/gvisor-LICENSE.txt release-assets/gvisor-LICENSE.txt
          (cd release-assets && sha256sum * > CHECKSUMS.txt)

          test -s release-assets/ConnectX-v0.3.0-alpha.3-debug.apk
          test -s release-assets/ConnectX-v0.3.0-alpha.3-native.zip
          test -s release-assets/CHECKSUMS.txt

      - name: Upload prepared release assets
        uses: actions/upload-artifact@v4
        with:
          name: alpha3-release-assets-${{ github.sha }}
          path: release-assets
          if-no-files-found: error
          retention-days: 14

      - name: Publish or verify GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local ref_json object_type object_sha tag_json
            ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME")"
            object_type="$(jq -r '.object.type' <<<"$ref_json")"
            object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
            if [[ "$object_type" == 'tag' ]]; then
              tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              object_type="$(jq -r '.object.type' <<<"$tag_json")"
              object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
            fi
            test "$object_type" = 'commit'
            printf '%s\n' "$object_sha"
          }

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(resolve_tag_commit)" = "$TARGET_SHA"
            test "$(gh release view "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isPrerelease \
              --jq '.isPrerelease')" = 'true'

            mkdir -p existing-release-assets
            for asset_path in release-assets/*; do
              asset_name="$(basename "$asset_path")"
              if gh release view "$TAG_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[].name' | grep -Fxq "$asset_name"; then
                gh release download "$TAG_NAME" \
                  --repo "$GITHUB_REPOSITORY" \
                  --pattern "$asset_name" \
                  --dir existing-release-assets
                cmp -s "$asset_path" "existing-release-assets/$asset_name"
              else
                gh release upload "$TAG_NAME" "$asset_path" \
                  --repo "$GITHUB_REPOSITORY"
              fi
            done

            gh release edit "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'ConnectX v0.3.0-alpha.3 — Restricted-network TLS Evidence Lab' \
              --notes-file docs/releases/v0.3.0-alpha.3.md \
              --prerelease
            exit 0
          fi

          gh release create "$TAG_NAME" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title 'ConnectX v0.3.0-alpha.3 — Restricted-network TLS Evidence Lab' \
            --notes-file docs/releases/v0.3.0-alpha.3.md \
            --prerelease
