name: Publish v0.3.0-alpha.3

on:
  push:
    branches:
      - main
    paths:
      - docs/releases/v0.3.0-alpha.3.publish
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: release-v0.3.0-alpha.3
  cancel-in-progress: false

jobs:
  await_android_ci:
    name: Await exact Android CI
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      run_id: ${{ steps.await.outputs.run_id }}

    steps:
      - name: Wait for successful Android CI on exact commit
        id: await
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 140); do
            runs_json="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "Android CI" \
              --commit "$TARGET_SHA" \
              --limit 20 \
              --json databaseId,status,conclusion,event,headSha)"

            selected="$(jq -c \
              --arg sha "$TARGET_SHA" \
              '[.[] | select(.headSha == $sha and .event == "push")] | sort_by(.databaseId) | last // empty' \
              <<<"$runs_json")"

            if [[ -z "$selected" ]]; then
              echo "Android CI push run for $TARGET_SHA is not visible yet ($attempt/140)."
              sleep 30
              continue
            fi

            run_id="$(jq -r '.databaseId' <<<"$selected")"
            status="$(jq -r '.status' <<<"$selected")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$selected")"
            echo "Android CI run $run_id: status=$status conclusion=$conclusion"

            if [[ "$status" != "completed" ]]; then
              sleep 30
              continue
            fi
            if [[ "$conclusion" != "success" ]]; then
              echo "Exact-commit Android CI did not pass; release is blocked."
              exit 1
            fi

            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            exit 0
          done

          echo "Timed out waiting for exact-commit Android CI."
          exit 1

  prepare_and_publish:
    name: Prepare and publish prerelease
    needs: await_android_ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify release metadata and safety docs
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 10' app/build.gradle.kts
          grep -q 'versionName = "0.3.0-alpha.3"' app/build.gradle.kts
          test -s docs/releases/v0.3.0-alpha.3.md
          test -s docs/architecture/external-tls-evidence.md
          grep -q '192.0.2.0/24' docs/architecture/external-tls-evidence.md
          grep -q 'does not claim a universal' docs/releases/v0.3.0-alpha.3.md
          test -s THIRD_PARTY_NOTICES.md
          test -s licenses/tun2socks-MIT.txt
          test -s licenses/gvisor-LICENSE.txt
          test ! -e docs/releases/v0.3.0-alpha.3.publish || \
            grep -q 'Publish v0.3.0-alpha.3' docs/releases/v0.3.0-alpha.3.publish

      - name: Download exact Android CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.await_android_ci.outputs.run_id }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded/apk downloaded/native
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "connectx-debug-$TARGET_SHA" \
            --dir downloaded/apk
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "connectx-native-$TARGET_SHA" \
            --dir downloaded/native
          test -s downloaded/apk/app-debug.apk
          test -s downloaded/native/jniLibs/arm64-v8a/libconnectxbridge.so
          test -s downloaded/native/jniLibs/x86_64/libconnectxbridge.so

      - name: Verify APK payload
        shell: bash
        run: |
          set -euo pipefail
          unzip -l downloaded/apk/app-debug.apk | tee apk-contents.txt
          grep -q 'lib/arm64-v8a/libconnectxbridge.so' apk-contents.txt
          grep -q 'lib/x86_64/libconnectxbridge.so' apk-contents.txt
          grep -q 'assets/THIRD_PARTY_NOTICES.md' apk-contents.txt
          grep -q 'assets/tun2socks-MIT.txt' apk-contents.txt
          grep -q 'assets/gvisor-LICENSE.txt' apk-contents.txt

      - name: Prepare deterministic release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp downloaded/apk/app-debug.apk \
            release-assets/ConnectX-v0.3.0-alpha.3-debug.apk

          find downloaded/native -type f -exec touch -t 198001010000 {} +
          (cd downloaded/native && \
            find . -type f -print0 | sort -z | \
            xargs -0 zip -X "$GITHUB_WORKSPACE/release-assets/ConnectX-v0.3.0-alpha.3-native.zip")

          cp THIRD_PARTY_NOTICES.md \
            release-assets/THIRD_PARTY_NOTICES-v0.3.0-alpha.3.md
          cp licenses/tun2socks-MIT.txt release-assets/tun2socks-MIT.txt
          cp licenses/gvisor-LICENSE.txt release-assets/gvisor-LICENSE.txt
          (cd release-assets && sha256sum * > CHECKSUMS.txt)
          test -s release-assets/CHECKSUMS.txt

      - name: Upload prepared release assets
        uses: actions/upload-artifact@v4
        with:
          name: strategy-alpha3-release-assets-${{ github.sha }}
          path: release-assets
          if-no-files-found: error
          retention-days: 14

      - name: Publish or verify GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v0.3.0-alpha.3
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local ref_json object_type object_sha tag_json
            ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME")"
            object_type="$(jq -r '.object.type' <<<"$ref_json")"
            object_sha="$(jq -r '.object.sha' <<<"$ref_json")"

            if [[ "$object_type" == "tag" ]]; then
              tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              object_type="$(jq -r '.object.type' <<<"$tag_json")"
              object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
            fi

            if [[ "$object_type" != "commit" ]]; then
              echo "Tag $TAG_NAME does not resolve to a commit." >&2
              return 1
            fi
            printf '%s\n' "$object_sha"
          }

          verify_or_upload_assets() {
            local names asset_path asset_name downloaded_path
            mkdir -p existing-release-assets
            names="$(gh release view "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name')"

            for asset_path in release-assets/*; do
              asset_name="$(basename "$asset_path")"
              if grep -Fxq "$asset_name" <<<"$names"; then
                gh release download "$TAG_NAME" \
                  --repo "$GITHUB_REPOSITORY" \
                  --pattern "$asset_name" \
                  --dir existing-release-assets
                downloaded_path="existing-release-assets/$asset_name"
                test -s "$downloaded_path"
                if ! cmp -s "$asset_path" "$downloaded_path"; then
                  echo "Existing release asset $asset_name differs from exact-commit output."
                  exit 1
                fi
              else
                gh release upload "$TAG_NAME" "$asset_path" \
                  --repo "$GITHUB_REPOSITORY"
              fi
            done
          }

          if gh release view "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_sha="$(resolve_tag_commit)"
            if [[ "$existing_sha" != "$TARGET_SHA" ]]; then
              echo "Existing tag $TAG_NAME points to $existing_sha, expected $TARGET_SHA."
              exit 1
            fi

            metadata="$(gh release view "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isPrerelease)"
            if [[ "$(jq -r '.isPrerelease' <<<"$metadata")" != "true" ]]; then
              echo "Existing release $TAG_NAME is not marked as a prerelease."
              exit 1
            fi

            verify_or_upload_assets
            gh release edit "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ConnectX v0.3.0-alpha.3 — Restricted-network TLS Evidence Lab" \
              --notes-file docs/releases/v0.3.0-alpha.3.md \
              --prerelease
            echo "Verified existing prerelease $TAG_NAME at $TARGET_SHA."
            exit 0
          fi

          gh release create "$TAG_NAME" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "ConnectX v0.3.0-alpha.3 — Restricted-network TLS Evidence Lab" \
            --notes-file docs/releases/v0.3.0-alpha.3.md \
            --prerelease
