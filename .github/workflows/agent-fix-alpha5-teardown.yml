name: Apply alpha.5 teardown fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/v0.3.0-alpha5'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout alpha.5 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Harden idempotent tunnel cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('vpn/service/src/main/kotlin/dev/connectx/vpn/service/ConnectXTunnelService.kt')
          text = path.read_text(encoding='utf-8')
          if 'private fun normalizeCleanupError(' in text:
              raise SystemExit(0)

          old = '''        nativeVersion = null
                  activeMode = TunnelContract.MODE_FOUNDATION
                  return firstError
              }

              private fun buildFailureMessage(
          '''
          new = '''        nativeVersion = null
                  activeMode = TunnelContract.MODE_FOUNDATION
                  return normalizeCleanupError(firstError)
              }

              /**
               * Relay and echo workers remove sockets concurrently while shutdown
               * closes the same bounded registries. Android/Kotlin collections can
               * report NoSuchElementException after the resource was already removed.
               * It is benign only when the native bridge confirms the stop postcondition.
               */
              private fun normalizeCleanupError(error: Throwable?): Throwable? {
                  if (error == null || !error.hasNoSuchElementCause()) return error
                  val nativeStopped = runCatching { !NativeTunBridge.isRunning() }
                      .getOrDefault(false)
                  return if (nativeStopped) null else error
              }

              private fun Throwable.hasNoSuchElementCause(): Boolean {
                  var current: Throwable? = this
                  var depth = 0
                  while (current != null && depth < 8) {
                      if (current is NoSuchElementException) return true
                      current = current.cause
                      depth += 1
                  }
                  return false
              }

              private fun buildFailureMessage(
          '''
          if old not in text:
              raise SystemExit('closeTunnelResources return block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git add vpn/service/src/main/kotlin/dev/connectx/vpn/service/ConnectXTunnelService.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(vpn): tolerate completed concurrent teardown'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
