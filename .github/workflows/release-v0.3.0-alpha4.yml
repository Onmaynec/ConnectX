name: Publish v0.3.0-alpha.4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.3.0-alpha4.yml
      - docs/releases/v0.3.0-alpha.4.publish
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v0.3.0-alpha.4
  cancel-in-progress: false

jobs:
  verify-and-publish:
    name: Verify exact commit and publish prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      TARGET_SHA: ${{ github.sha }}
      TAG_NAME: v0.3.0-alpha.4
      MARKER_PATH: docs/releases/v0.3.0-alpha.4.publish
      ANDROID_AVD_HOME: ${{ runner.temp }}/connectx-alpha4-avd
      ANDROID_USER_HOME: ${{ runner.temp }}/connectx-alpha4-android-user
      CONNECTX_VERIFY_OUT: ${{ github.workspace }}/build/release-verification-alpha4
      GRADLE_BIN: gradle
      ADB_SERIAL: emulator-5554

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify release activation and metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            parent_sha="$(git rev-parse "$TARGET_SHA^1")"
            git diff --name-only "$parent_sha" "$TARGET_SHA" | tee release-changed-files.txt
            grep -Fxq "$MARKER_PATH" release-changed-files.txt
            grep -Fxq '.github/workflows/release-v0.3.0-alpha4.yml' release-changed-files.txt
          fi
          grep -Fq 'Publish ConnectX v0.3.0-alpha.4' "$MARKER_PATH"
          grep -Fq 'versionCode = 11' app/build.gradle.kts
          grep -Fq 'versionName = "0.3.0-alpha.4"' app/build.gradle.kts
          grep -Fq '## [0.3.0-alpha.4]' CHANGELOG.md
          test -s docs/releases/v0.3.0-alpha.4.md
          test -s docs/roadmap/alpha4-scope.md
          test -s THIRD_PARTY_NOTICES.md
          test -s licenses/tun2socks-MIT.txt
          test -s licenses/gvisor-LICENSE.txt
          test ! -e .github/workflows/agent-source-export.yml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.26.3
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: |
            engine/go/go.mod
            engine/go/go.sum

      - name: Install locked Android toolchain and emulator image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.0.13004108" \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/emulator/emulator"
          test -d "$ANDROID_SDK_ROOT/ndk/28.0.13004108"
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check | tee accel-check.txt
          df -h / | tee disk-before-verification.txt

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Create Android 35 x86_64 AVD
        shell: bash
        run: |
          set -euo pipefail
          echo no | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" \
            create avd \
            --force \
            --name connectx-alpha4-release \
            --path "$ANDROID_AVD_HOME/connectx-alpha4-release.avd" \
            --package "system-images;android-35;google_apis;x86_64"
          "$ANDROID_SDK_ROOT/emulator/emulator" -list-avds | tee avd-list.txt
          grep -qx 'connectx-alpha4-release' avd-list.txt

      - name: Start emulator and wait for Android
        shell: bash
        run: |
          set -euo pipefail
          ADB="$ANDROID_SDK_ROOT/platform-tools/adb"
          EMULATOR="$ANDROID_SDK_ROOT/emulator/emulator"
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          nohup "$EMULATOR" \
            -avd connectx-alpha4-release \
            -accel on \
            -memory 2048 \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -no-snapshot-save \
            -no-metrics \
            -gpu swiftshader_indirect \
            > emulator.log 2>&1 &
          echo "$!" > emulator.pid
          sleep 5
          kill -0 "$(cat emulator.pid)"
          "$ADB" start-server
          timeout 300 "$ADB" -s "$ADB_SERIAL" wait-for-device
          deadline=$((SECONDS + 300))
          until [[ "$("$ADB" -s "$ADB_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; do
            kill -0 "$(cat emulator.pid)" 2>/dev/null || { cat emulator.log; exit 1; }
            (( SECONDS < deadline )) || { cat emulator.log; exit 1; }
            sleep 5
          done
          test "$("$ADB" -s "$ADB_SERIAL" shell getprop ro.build.version.sdk | tr -d '\r')" = "35"
          test "$("$ADB" -s "$ADB_SERIAL" shell getprop ro.product.cpu.abi | tr -d '\r')" = "x86_64"

      - name: Run canonical alpha.4 build and Android gates
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/verify-alpha4-local.sh
          scripts/verify-alpha4-local.sh --clean --device
          grep -Fq "Commit: $TARGET_SHA" "$CONNECTX_VERIFY_OUT/RESULT.txt"
          grep -Fq 'Static build gates: passed' "$CONNECTX_VERIFY_OUT/RESULT.txt"
          grep -Fq 'Android runtime gates: passed' "$CONNECTX_VERIFY_OUT/RESULT.txt"
          test "$(cat "$CONNECTX_VERIFY_OUT/COMMIT_SHA.txt")" = "$TARGET_SHA"

      - name: Collect release diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p release-diagnostics
          cp emulator.log accel-check.txt avd-list.txt disk-before-verification.txt release-diagnostics/ 2>/dev/null
          cp -R "$CONNECTX_VERIFY_OUT" release-diagnostics/verification 2>/dev/null
          "$ANDROID_SDK_ROOT/platform-tools/adb" -s "$ADB_SERIAL" logcat -d > release-diagnostics/logcat.txt 2>&1

      - name: Stop release emulator
        if: always()
        shell: bash
        run: |
          "$ANDROID_SDK_ROOT/platform-tools/adb" -s "$ADB_SERIAL" emu kill || true
          [[ ! -f emulator.pid ]] || kill "$(cat emulator.pid)" 2>/dev/null || true

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha4-release-verification-${{ github.sha }}
          path: release-diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare deterministic release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets native-package
          cp "$CONNECTX_VERIFY_OUT/apk/ConnectX-v0.3.0-alpha.4-debug.apk" \
            release-assets/ConnectX-v0.3.0-alpha.4-debug.apk
          cp -R "$CONNECTX_VERIFY_OUT/native/jniLibs" native-package/jniLibs
          find native-package -type f -exec touch -t 198001010000 {} +
          (cd native-package && find . -type f -print0 | sort -z | \
            xargs -0 zip -X "$GITHUB_WORKSPACE/release-assets/ConnectX-v0.3.0-alpha.4-native.zip")
          cp THIRD_PARTY_NOTICES.md release-assets/THIRD_PARTY_NOTICES-v0.3.0-alpha.4.md
          cp licenses/tun2socks-MIT.txt release-assets/tun2socks-MIT.txt
          cp licenses/gvisor-LICENSE.txt release-assets/gvisor-LICENSE.txt
          (cd release-assets && sha256sum * > CHECKSUMS.txt)
          test -s release-assets/ConnectX-v0.3.0-alpha.4-debug.apk
          test -s release-assets/ConnectX-v0.3.0-alpha.4-native.zip
          test -s release-assets/CHECKSUMS.txt

      - name: Upload prepared release assets
        uses: actions/upload-artifact@v4
        with:
          name: alpha4-release-assets-${{ github.sha }}
          path: release-assets
          if-no-files-found: error
          retention-days: 14

      - name: Publish or verify GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" --jq '.object.sha')"
            test "$existing_sha" = "$TARGET_SHA"
            gh release upload "$TAG_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'ConnectX v0.3.0-alpha.4 — Repeated Restricted-network Evidence' \
              --notes-file docs/releases/v0.3.0-alpha.4.md \
              --prerelease
          else
            gh release create "$TAG_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title 'ConnectX v0.3.0-alpha.4 — Repeated Restricted-network Evidence' \
              --notes-file docs/releases/v0.3.0-alpha.4.md \
              --prerelease
          fi
