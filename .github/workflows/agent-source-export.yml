name: Apply ConnectX alpha.4 change set

on:
  pull_request:
    branches:
      - main
    paths:
      - docs/ops/alpha4.patch.gz.b64
      - .github/workflows/agent-source-export.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'feature/v0.3.0-alpha4' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout alpha.4 branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.3.0-alpha4
          fetch-depth: 0

      - name: Apply reviewed alpha.4 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode docs/ops/alpha4.patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/alpha4.patch"
          git apply --check "$RUNNER_TEMP/alpha4.patch"
          git apply "$RUNNER_TEMP/alpha4.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement ConnectX v0.3.0-alpha.4"
          git push origin HEAD:feature/v0.3.0-alpha4
