name: Synchronize alpha.3 with main

on:
  push:
    branches:
      - ops/alpha3-sync-trigger

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted default branch history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge main into alpha.3 and preserve premium UI conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feature/v0.3.0-alpha3
          git checkout -B alpha3-work origin/feature/v0.3.0-alpha3

          set +e
          git merge --no-ff -X theirs origin/main \
            -m "chore: synchronize alpha.3 with premium UI main"
          merge_status=$?
          set -e

          if [[ $merge_status -ne 0 ]]; then
            echo "Resolving remaining conflicts in favor of trusted main."
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              if git checkout --theirs -- "$path" 2>/dev/null; then
                git add -- "$path"
              else
                git rm -f -- "$path"
              fi
            done < <(git diff --name-only --diff-filter=U)

            if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
              echo "Unresolved paths remain."
              git status --short
              exit 1
            fi
            git commit -m "chore: synchronize alpha.3 with premium UI main"
          fi

          test -f app/src/main/kotlin/dev/connectx/app/home/DashboardScreen.kt
          test -f app/src/main/kotlin/dev/connectx/app/evidence/ExternalTlsEvidencePanel.kt
          test -f vpn/service/src/main/kotlin/dev/connectx/vpn/service/ConnectXExternalTlsEvidenceService.kt
          test -f strategy/api/src/main/kotlin/dev/connectx/strategy/api/ExternalTlsEvidenceTarget.kt

          git status --short
          git push origin HEAD:feature/v0.3.0-alpha3
