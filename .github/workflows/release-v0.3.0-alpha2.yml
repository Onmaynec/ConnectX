name: Publish v0.3.0-alpha.2

on:
  push:
    branches:
      - main
    paths:
      - docs/releases/v0.3.0-alpha.2.publish
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: release-v0.3.0-alpha.2
  cancel-in-progress: false

jobs:
  await-android-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      run-id: ${{ steps.await.outputs.run-id }}

    steps:
      - name: Wait for successful Android CI on exact commit
        id: await
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 140); do
            runs_json="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "Android CI" \
              --commit "$TARGET_SHA" \
              --limit 20 \
              --json databaseId,status,conclusion,event,headSha)"

            selected="$(jq -c \
              --arg sha "$TARGET_SHA" \
              '[.[] | select(.headSha == $sha and .event == "push")] | sort_by(.databaseId) | last // empty' \
              <<<"$runs_json")"

            if [[ -z "$selected" ]]; then
              echo "Android CI push run for $TARGET_SHA is not visible yet ($attempt/140)."
              sleep 30
              continue
            fi

            run_id="$(jq -r '.databaseId' <<<"$selected")"
            status="$(jq -r '.status' <<<"$selected")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$selected")"
            echo "Android CI run $run_id: status=$status conclusion=$conclusion"

            if [[ "$status" != "completed" ]]; then
              sleep 30
              continue
            fi
            if [[ "$conclusion" != "success" ]]; then
              echo "Exact-commit Android CI did not pass; release is blocked."
              exit 1
            fi

            echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
            exit 0
          done

          echo "Timed out waiting for exact-commit Android CI."
          exit 1

  prepare-and-publish:
    needs: await-android-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 9' app/build.gradle.kts
          grep -q 'versionName = "0.3.0-alpha.2"' app/build.gradle.kts
          test -s docs/releases/v0.3.0-alpha.2.md
          test -s docs/architecture/strategy-evaluation.md
          test -s THIRD_PARTY_NOTICES.md
          test -s licenses/tun2socks-MIT.txt
          test -s licenses/gvisor-LICENSE.txt

      - name: Download exact Android CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.await-android-ci.outputs.run-id }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded/apk downloaded/native
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "connectx-debug-$TARGET_SHA" \
            --dir downloaded/apk
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "connectx-native-$TARGET_SHA" \
            --dir downloaded/native
          test -s downloaded/apk/app-debug.apk
          test -s downloaded/native/jniLibs/arm64-v8a/libconnectxbridge.so
          test -s downloaded/native/jniLibs/x86_64/libconnectxbridge.so

      - name: Verify APK payload
        shell: bash
        run: |
          set -euo pipefail
          unzip -l downloaded/apk/app-debug.apk | tee apk-contents.txt
          grep -q 'lib/arm64-v8a/libconnectxbridge.so' apk-contents.txt
          grep -q 'lib/x86_64/libconnectxbridge.so' apk-contents.txt
          grep -q 'assets/THIRD_PARTY_NOTICES.md' apk-contents.txt
          grep -q 'assets/tun2socks-MIT.txt' apk-contents.txt
          grep -q 'assets/gvisor-LICENSE.txt' apk-contents.txt

      - name: Prepare release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp downloaded/apk/app-debug.apk \
            release-assets/ConnectX-v0.3.0-alpha.2-debug.apk
          (cd downloaded/native && \
            zip -r "$GITHUB_WORKSPACE/release-assets/ConnectX-v0.3.0-alpha.2-native.zip" .)
          cp THIRD_PARTY_NOTICES.md \
            release-assets/THIRD_PARTY_NOTICES-v0.3.0-alpha.2.md
          cp licenses/tun2socks-MIT.txt release-assets/tun2socks-MIT.txt
          cp licenses/gvisor-LICENSE.txt release-assets/gvisor-LICENSE.txt
          (cd release-assets && sha256sum * > CHECKSUMS.txt)

      - name: Upload prepared release assets
        uses: actions/upload-artifact@v4
        with:
          name: strategy-alpha2-release-assets-${{ github.sha }}
          path: release-assets
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v0.3.0-alpha.2
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG_NAME" \
            release-assets/* \
            --target "$TARGET_SHA" \
            --title "ConnectX v0.3.0-alpha.2 — Strategy Evaluation and Rollback Gate" \
            --notes-file docs/releases/v0.3.0-alpha.2.md \
            --prerelease
