name: Publish v0.3.0-alpha.3

on:
  workflow_run:
    workflows:
      - Android CI
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: release-v0.3.0-alpha.3
  cancel-in-progress: false

jobs:
  prepare-and-publish:
    name: Publish exact successful Android CI output
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      TAG_NAME: v0.3.0-alpha.3
      MARKER_PATH: docs/releases/v0.3.0-alpha.3.publish

    steps:
      - name: Checkout exact successful commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Verify exact Android CI event and release activation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "Checked out $actual_sha, expected $TARGET_SHA."
            exit 1
          fi

          run_json="$(gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json name,status,conclusion,event,headSha)"
          test "$(jq -r '.name' <<<"$run_json")" = "Android CI"
          test "$(jq -r '.status' <<<"$run_json")" = "completed"
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success"
          test "$(jq -r '.event' <<<"$run_json")" = "push"
          test "$(jq -r '.headSha' <<<"$run_json")" = "$TARGET_SHA"

          parent_sha="$(git rev-parse "$TARGET_SHA^1")"
          git diff --name-only "$parent_sha" "$TARGET_SHA" | tee release-changed-files.txt
          grep -Fxq "$MARKER_PATH" release-changed-files.txt

          grep -Fq 'Publish ConnectX v0.3.0-alpha.3' "$MARKER_PATH"
          grep -Fq 'versionCode = 10' app/build.gradle.kts
          grep -Fq 'versionName = "0.3.0-alpha.3"' app/build.gradle.kts
          grep -Fq '## [0.3.0-alpha.3]' CHANGELOG.md
          test -s docs/releases/v0.3.0-alpha.3.md
          test -s docs/architecture/external-tls-evidence.md
          grep -Fq '192.0.2.0/24' docs/architecture/external-tls-evidence.md
          grep -Fq 'does not claim a universal' docs/releases/v0.3.0-alpha.3.md
          if grep -Fq 'Current infrastructure limitation' docs/releases/v0.3.0-alpha.3.md; then
            echo "Release notes still contain the obsolete runner blocker."
            exit 1
          fi
          test -s THIRD_PARTY_NOTICES.md
          test -s licenses/tun2socks-MIT.txt
          test -s licenses/gvisor-LICENSE.txt
          test ! -e .github/workflows/cancel-stale-alpha3-publishers.yml
          test ! -e docs/releases/v0.3.0-alpha.3.cancel-stale

      - name: Download exact Android CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded/apk downloaded/native
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "connectx-debug-$TARGET_SHA" \
            --dir downloaded/apk
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "connectx-native-$TARGET_SHA" \
            --dir downloaded/native
          test -s downloaded/apk/app-debug.apk
          test -s downloaded/native/jniLibs/arm64-v8a/libconnectxbridge.so
          test -s downloaded/native/jniLibs/x86_64/libconnectxbridge.so

      - name: Verify APK payload
        shell: bash
        run: |
          set -euo pipefail
          unzip -l downloaded/apk/app-debug.apk | tee apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libconnectxbridge.so' apk-contents.txt
          grep -Fq 'lib/x86_64/libconnectxbridge.so' apk-contents.txt
          grep -Fq 'assets/THIRD_PARTY_NOTICES.md' apk-contents.txt
          grep -Fq 'assets/tun2socks-MIT.txt' apk-contents.txt
          grep -Fq 'assets/gvisor-LICENSE.txt' apk-contents.txt

      - name: Prepare deterministic release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp downloaded/apk/app-debug.apk \
            release-assets/ConnectX-v0.3.0-alpha.3-debug.apk

          find downloaded/native -type f -exec touch -t 198001010000 {} +
          (cd downloaded/native && \
            find . -type f -print0 | sort -z | \
            xargs -0 zip -X "$GITHUB_WORKSPACE/release-assets/ConnectX-v0.3.0-alpha.3-native.zip")

          cp THIRD_PARTY_NOTICES.md \
            release-assets/THIRD_PARTY_NOTICES-v0.3.0-alpha.3.md
          cp licenses/tun2socks-MIT.txt release-assets/tun2socks-MIT.txt
          cp licenses/gvisor-LICENSE.txt release-assets/gvisor-LICENSE.txt
          (cd release-assets && sha256sum * > CHECKSUMS.txt)
          test -s release-assets/CHECKSUMS.txt

      - name: Upload prepared release assets
        uses: actions/upload-artifact@v4
        with:
          name: strategy-alpha3-release-assets-${{ github.event.workflow_run.head_sha }}
          path: release-assets
          if-no-files-found: error
          retention-days: 14

      - name: Publish or verify GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local ref_json object_type object_sha tag_json
            ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME")"
            object_type="$(jq -r '.object.type' <<<"$ref_json")"
            object_sha="$(jq -r '.object.sha' <<<"$ref_json")"

            if [[ "$object_type" == "tag" ]]; then
              tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              object_type="$(jq -r '.object.type' <<<"$tag_json")"
              object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
            fi

            if [[ "$object_type" != "commit" ]]; then
              echo "Tag $TAG_NAME does not resolve to a commit." >&2
              return 1
            fi
            printf '%s\n' "$object_sha"
          }

          verify_or_upload_assets() {
            local names asset_path asset_name downloaded_path
            mkdir -p existing-release-assets
            names="$(gh release view "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name')"

            for asset_path in release-assets/*; do
              asset_name="$(basename "$asset_path")"
              if grep -Fxq "$asset_name" <<<"$names"; then
                gh release download "$TAG_NAME" \
                  --repo "$GITHUB_REPOSITORY" \
                  --pattern "$asset_name" \
                  --dir existing-release-assets
                downloaded_path="existing-release-assets/$asset_name"
                test -s "$downloaded_path"
                if ! cmp -s "$asset_path" "$downloaded_path"; then
                  echo "Existing release asset $asset_name differs from exact-commit output."
                  exit 1
                fi
              else
                gh release upload "$TAG_NAME" "$asset_path" \
                  --repo "$GITHUB_REPOSITORY"
              fi
            done
          }

          if gh release view "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_sha="$(resolve_tag_commit)"
            if [[ "$existing_sha" != "$TARGET_SHA" ]]; then
              echo "Existing tag $TAG_NAME points to $existing_sha, expected $TARGET_SHA."
              exit 1
            fi

            metadata="$(gh release view "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isPrerelease)"
            test "$(jq -r '.isPrerelease' <<<"$metadata")" = "true"

            verify_or_upload_assets
            gh release edit "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ConnectX v0.3.0-alpha.3 — Restricted-network TLS Evidence Lab" \
              --notes-file docs/releases/v0.3.0-alpha.3.md \
              --prerelease
            echo "Verified existing prerelease $TAG_NAME at $TARGET_SHA."
            exit 0
          fi

          gh release create "$TAG_NAME" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "ConnectX v0.3.0-alpha.3 — Restricted-network TLS Evidence Lab" \
            --notes-file docs/releases/v0.3.0-alpha.3.md \
            --prerelease
