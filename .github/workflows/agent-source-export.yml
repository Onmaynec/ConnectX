name: Apply ConnectX alpha.4 change set

on:
  pull_request:
    branches:
      - main
    paths:
      - docs/ops/alpha4.patch.gz.b64.part-*
      - .github/workflows/agent-source-export.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'feature/v0.3.0-alpha4' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout alpha.4 branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.3.0-alpha4
          fetch-depth: 0

      - name: Apply reviewed alpha.4 patch
        shell: bash
        run: |
          set -euo pipefail
          cat docs/ops/alpha4.patch.gz.b64.part-* > "$RUNNER_TEMP/alpha4.patch.gz.b64"
          echo '098c0d00c1eb9abb7de4a6458d877e9d3f8cbcd5063b8640daec481b6a9b7680  '"$RUNNER_TEMP/alpha4.patch.gz.b64" | sha256sum -c -
          base64 --decode "$RUNNER_TEMP/alpha4.patch.gz.b64" > "$RUNNER_TEMP/alpha4.patch.gz"
          echo 'b36d00637c3814737b16ecb04699b5a301b281f4f3666c88df06976adb7917cc  '"$RUNNER_TEMP/alpha4.patch.gz" | sha256sum -c -
          gzip --decompress --stdout "$RUNNER_TEMP/alpha4.patch.gz" > "$RUNNER_TEMP/alpha4.patch"
          echo 'b8bc6e6975a71d8f2fb4f957ce870c91c373ffb43e86e2942a014097f1143379  '"$RUNNER_TEMP/alpha4.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/alpha4.patch"
          git apply "$RUNNER_TEMP/alpha4.patch"
          git checkout HEAD -- .github/workflows/agent-source-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement ConnectX v0.3.0-alpha.4"
          git push origin HEAD:feature/v0.3.0-alpha4
