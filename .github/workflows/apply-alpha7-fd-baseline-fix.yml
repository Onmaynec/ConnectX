name: Apply alpha.7 FD baseline fix

on:
  push:
    branches:
      - feature/v0.3.0-alpha7

permissions:
  contents: write

concurrency:
  group: apply-alpha7-fd-baseline-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3.0-alpha7
          fetch-depth: 2
      - name: Apply and remove patch files
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix_alpha7_fd_baseline.py
          git rm -f \
            scripts/fix_alpha7_fd_baseline.py \
            .github/workflows/apply-alpha7-fd-baseline-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: exclude cold-start runtime from FD lifecycle"
          git push origin HEAD:feature/v0.3.0-alpha7
