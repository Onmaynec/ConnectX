name: Agent source export

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive source tree
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=connectx-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: connectx-alpha4-source-${{ github.sha }}
          path: connectx-source.zip
          if-no-files-found: error
          retention-days: 1
