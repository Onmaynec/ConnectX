name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.26.3
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: |
            engine/go/go.mod
            engine/go/go.sum

      - name: Install locked Android NDK
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108"

      - name: Test committed Go dependency lock
        working-directory: engine/go
        shell: bash
        run: |
          go mod download
          go mod verify
          go test -mod=readonly ./bridge
          git diff --exit-code -- go.mod go.sum

      - name: Build Android native bridge
        shell: bash
        run: |
          chmod +x engine/go/build-android.sh
          engine/go/build-android.sh "$ANDROID_SDK_ROOT/ndk/28.0.13004108"
          test -s engine/go/build/android/jniLibs/arm64-v8a/libconnectxbridge.so
          test -s engine/go/build/android/jniLibs/x86_64/libconnectxbridge.so
          file engine/go/build/android/jniLibs/*/libconnectxbridge.so

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests
        run: gradle --no-daemon test

      - name: Android lint
        run: gradle --no-daemon lintDebug

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify native and legal APK payloads
        shell: bash
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | tee apk-contents.txt
          grep -q 'lib/arm64-v8a/libconnectxbridge.so' apk-contents.txt
          grep -q 'lib/x86_64/libconnectxbridge.so' apk-contents.txt
          grep -q 'assets/THIRD_PARTY_NOTICES.md' apk-contents.txt
          grep -q 'assets/tun2socks-MIT.txt' apk-contents.txt
          grep -q 'assets/gvisor-LICENSE.txt' apk-contents.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: connectx-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload native bridge
        uses: actions/upload-artifact@v4
        with:
          name: connectx-native-${{ github.sha }}
          path: engine/go/build/android
          if-no-files-found: error
          retention-days: 14

  android-runtime-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Download verified native bridge
        uses: actions/download-artifact@v4
        with:
          name: connectx-native-${{ github.sha }}
          path: engine/go/build/android

      - name: Enable KVM access
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Install Android emulator image
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"
          echo no | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" \
            create avd \
            --force \
            --name connectx-ci \
            --package "system-images;android-35;google_apis;x86_64"

      - name: Start emulator and wait for Android
        shell: bash
        run: |
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" \
            -avd connectx-ci \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -no-metrics \
            -gpu swiftshader_indirect \
            > emulator.log 2>&1 &

          adb wait-for-device
          timeout 300 bash -c '
            until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do
              sleep 5
            done
          '
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.product.cpu.abi
          adb shell getprop ro.build.version.sdk

      - name: Run native bridge Android smoke test
        run: gradle --no-daemon :vpn:nativebridge:connectedDebugAndroidTest

      - name: Collect emulator diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p emulator-diagnostics
          cp emulator.log emulator-diagnostics/ 2>/dev/null || true
          adb logcat -d > emulator-diagnostics/logcat.txt 2>/dev/null || true
          cp -R vpn/nativebridge/build/reports/androidTests emulator-diagnostics/reports 2>/dev/null || true
          cp -R vpn/nativebridge/build/outputs/androidTest-results emulator-diagnostics/results 2>/dev/null || true

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectx-emulator-smoke-${{ github.sha }}
          path: emulator-diagnostics
          if-no-files-found: warn
          retention-days: 14
