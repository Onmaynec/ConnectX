          write(
              "docs/roadmap/alpha7-scope.md",
              '''# v0.3.0-alpha.7 — Physical Device Evidence Kit

## Цель

Перевести оставшиеся physical-device блокеры #11 и #22 из неформальной инструкции в воспроизводимый readiness workflow с bounded FD evidence.

## Входит

- broad environment profile без уникальных идентификаторов;
- FD before/after/delta после полного evidence teardown;
- typed FD budget assessment;
- report schema v3 и deterministic report ID;
- три последовательные Android TUN/native evidence-сессии;
- strict physical arm64 collector и bundle validator;
- runbook ручной restricted-network проверки.

## Не входит

- default route;
- обычный пользовательский трафик;
- автоматическое включение стратегии;
- удалённый сервер;
- HTTP, MITM или расшифровка HTTPS;
- автоматическое заявление о подтверждённом bypass;
- закрытие #11 или #22 без фактического physical-device результата.

## Release gate

Релиз публикуется только после полного Android CI на exact `main` commit. Physical collector поставляется и тестируется статически, но реальный physical arm64 bundle должен быть создан отдельно владельцем устройства.
''',
          )

          write(
              "docs/releases/v0.3.0-alpha.7.md",
              '''# ConnectX v0.3.0-alpha.7 — Physical Device Evidence Kit

Alpha.7 добавляет воспроизводимый путь проверки ConnectX на физическом Android arm64-устройстве и измерение file-descriptor lifecycle для repeated TLS evidence.

## Добавлено

- privacy-safe device class, Android API и ABI family;
- FD before/after/delta после полного teardown;
- typed bounded FD assessment;
- redacted evidence report schema v3;
- три последовательные TEST-NET evidence-сессии в instrumentation;
- strict physical arm64 collector;
- allow-list bundle validator и negative privacy tests;
- physical-device runbook.

## Проверка релиза

- release guard и repository consistency;
- JVM unit tests, включая environment/FD policy и bundle validator;
- Android lint;
- APK, обе ABI и legal payload;
- Android 35 strategy, repeated evidence, JNI, TCP, UDP и DNS gates;
- exact successful main commit publication.

## Ограничения

- CI использует x86_64 emulator и не заменяет physical arm64 execution;
- collector readiness не является restricted-network proof;
- #11 требует отдельный schema v3 report из реальной ограниченной сети;
- #22 закрывается только после приложенного physical arm64 lifecycle bundle;
- обычный трафик приложений не проходит через ConnectX.
''',
          )

          changelog = "CHANGELOG.md"
          entry = '''## [0.3.0-alpha.7]

### Added

- Privacy-safe physical/emulator classification, Android API and broad ABI family for evidence reports.
- File-descriptor before/after/delta measurements taken around complete external evidence teardown.
- Typed bounded FD lifecycle assessment with explicit `WITHIN_BUDGET`, `EXCEEDED` and `UNKNOWN` states.
- Redacted report schema v3 with environment and FD aggregate fields in the deterministic report ID.
- Three sequential TEST-NET TUN/native evidence sessions in Android instrumentation.
- Strict physical arm64 evidence collector and allow-list bundle validator.
- Negative tests rejecting device identifiers, raw targets, URLs, credentials and unknown bundle fields.
- Application version `0.3.0-alpha.7`, versionCode `14`.
- Native bridge version `connectx-go-bridge/0.3.0-alpha.7`.

### Changed

- External evidence now reports FD lifecycle only after native session, TUN and relay teardown complete.
- Physical-device readiness evidence is separated from the manual restricted-network strategy claim.

### Safety boundaries

- No serial, model, manufacturer, fingerprint, SSID or network identifier is exported.
- TUN capture remains limited to TEST-NET-1 (`192.0.2.0/24`).
- Ordinary application traffic is not routed or modified.
- No HTTP, account data, MITM or HTTPS decryption is introduced.
- Issues #11 and #22 remain open until actual physical-device evidence is attached.

'''
          replace_once(changelog, "## [0.3.0-alpha.6]\n", entry + "## [0.3.0-alpha.6]\n")
          replace_all(
